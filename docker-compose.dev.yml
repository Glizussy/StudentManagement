services:
  api:
    command: flask --app app run --host 0.0.0.0 --port 5000 --reload
    environment:
      FLASK_ENV: development
    volumes:
      - ./api:/app
    ports:
      - "5000:5000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    ports:
      - "5432:5432"

  prometheus:
    ports:
      - "9090:9090"

  grafana:
    ports:
      - "3000:3000"
